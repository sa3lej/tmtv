name: Feature Request
description: Suggest an improvement or new capability
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for tmtv? We'd love to hear it. Describe the problem you're solving and how you'd like it to work.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or workflow that's missing or painful.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work? Be as specific as you want.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - SSH sharing
        - Web viewer
        - Server
        - Installation / packaging
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you've tried or other tools that handle this.
