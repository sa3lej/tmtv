name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            pkg-config \
            libevent-dev \
            libncurses-dev \
            libssh-dev \
            libmsgpack-dev \
            libbsd-dev \
            bison \
            libutf8proc-dev

      - name: Build
        run: |
          sh autogen.sh
          ./configure
          make -j$(nproc)

      - name: Package binaries
        run: |
          mkdir -p dist
          cp tmtv dist/tmtv-linux-amd64
          cp tmtv-server dist/tmtv-server-linux-amd64

      - uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: dist/

  build-macos:
    name: Build macOS client
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install \
            autoconf \
            automake \
            pkg-config \
            libevent \
            libssh \
            msgpack-c \
            openssl@3 \
            bison

      - name: Build utf8proc static library
        run: |
          # Homebrew utf8proc doesn't ship a .a, so build from source
          git clone --depth 1 https://github.com/JuliaStrings/utf8proc.git /tmp/utf8proc
          cd /tmp/utf8proc
          make libutf8proc.a
          # Install to a local prefix with pkg-config file
          mkdir -p /tmp/utf8proc-static/{lib/pkgconfig,include}
          cp libutf8proc.a /tmp/utf8proc-static/lib/
          cp utf8proc.h /tmp/utf8proc-static/include/
          cat > /tmp/utf8proc-static/lib/pkgconfig/libutf8proc.pc << 'PCEOF'
          prefix=/tmp/utf8proc-static
          libdir=${prefix}/lib
          includedir=${prefix}/include

          Name: libutf8proc
          Description: UTF-8 processing library
          Version: 2.9.0
          Libs: -L${libdir} -lutf8proc
          Cflags: -I${includedir}
          PCEOF
          # Remove leading whitespace from heredoc
          sed -i '' 's/^          //' /tmp/utf8proc-static/lib/pkgconfig/libutf8proc.pc

      - name: Build fully static binary
        run: |
          export PATH="$(brew --prefix bison)/bin:$PATH"
          BREW="$(brew --prefix)"
          OPENSSL="$(brew --prefix openssl@3)"

          # Gather all static archives
          STATIC_LIBS=""
          for pkg in libevent libssh msgpack-c openssl@3; do
            prefix=$(brew --prefix "$pkg")
            for a in "$prefix"/lib/*.a; do
              [ -f "$a" ] && STATIC_LIBS="$STATIC_LIBS $a"
            done
          done
          STATIC_LIBS="$STATIC_LIBS /tmp/utf8proc-static/lib/libutf8proc.a"

          echo "=== Static libs ==="
          echo "$STATIC_LIBS" | tr ' ' '\n'

          export PKG_CONFIG_PATH="/tmp/utf8proc-static/lib/pkgconfig:${PKG_CONFIG_PATH}"

          sh autogen.sh
          ./configure --enable-utf8proc \
            CPPFLAGS="-I${BREW}/include -I${OPENSSL}/include -I/tmp/utf8proc-static/include" \
            LDFLAGS="-L${BREW}/lib -L${OPENSSL}/lib -L/tmp/utf8proc-static/lib"
          make -j$(sysctl -n hw.ncpu) \
            LIBS="$STATIC_LIBS -lncurses -lz -lresolv -lgssapi_krb5 -framework Security -framework CoreFoundation -framework GSS"

      - name: Verify no external dylib deps
        run: |
          echo "=== otool -L tmtv ==="
          otool -L tmtv
          if otool -L tmtv | grep -q '/opt/homebrew\|/usr/local/Cellar'; then
            echo "ERROR: Binary links to Homebrew shared libraries"
            exit 1
          fi
          echo "Binary is fully static (no Homebrew dylibs)."

      - name: Package binary
        run: |
          mkdir -p dist
          cp tmtv dist/tmtv-macos-arm64
          codesign --force --sign - dist/tmtv-macos-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: dist/

  release:
    name: Create Release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
