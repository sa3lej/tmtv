name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            pkg-config \
            libevent-dev \
            libncurses-dev \
            libssh-dev \
            libmsgpack-dev \
            libbsd-dev \
            bison \
            libutf8proc-dev

      - name: Build
        run: |
          sh autogen.sh
          ./configure
          make -j$(nproc)

      - name: Package binaries
        run: |
          mkdir -p dist
          cp tmtv dist/tmtv-linux-amd64
          cp tmtv-server dist/tmtv-server-linux-amd64

      - uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: dist/

  build-macos:
    name: Build macOS client
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install \
            autoconf \
            automake \
            pkg-config \
            libevent \
            libssh \
            msgpack-c \
            openssl@3 \
            bison \
            utf8proc

      - name: Build with static deps
        run: |
          export PATH="$(brew --prefix bison)/bin:$PATH"
          BREW="$(brew --prefix)"
          OPENSSL="$(brew --prefix openssl@3)"

          # Collect .a paths for all deps
          STATIC_LIBS=""
          for pkg in libevent libssh msgpack-c utf8proc openssl@3; do
            prefix=$(brew --prefix "$pkg" 2>/dev/null) || continue
            for a in "$prefix"/lib/*.a; do
              [ -f "$a" ] && STATIC_LIBS="$STATIC_LIBS $a"
            done
          done

          # utf8proc may not ship .a — build from source if missing
          if ! echo "$STATIC_LIBS" | grep -q utf8proc; then
            echo "No static libutf8proc found, building from source..."
            UTF8_PREFIX=$(brew --prefix utf8proc)
            UTF8_SRC=$(find "$UTF8_PREFIX" -name "utf8proc.c" 2>/dev/null | head -1)
            if [ -z "$UTF8_SRC" ]; then
              # Fall back: compile from Homebrew's include + downloaded source
              curl -sL https://raw.githubusercontent.com/JuliaStrings/utf8proc/master/utf8proc.c -o /tmp/utf8proc_lib.c
              curl -sL https://raw.githubusercontent.com/JuliaStrings/utf8proc/master/utf8proc_data.c -o /tmp/utf8proc_data.c
              gcc -c -O2 -I"$UTF8_PREFIX/include" /tmp/utf8proc_lib.c -o /tmp/utf8proc_lib.o
              gcc -c -O2 -I"$UTF8_PREFIX/include" /tmp/utf8proc_data.c -o /tmp/utf8proc_data.o
              ar rcs /tmp/libutf8proc.a /tmp/utf8proc_lib.o /tmp/utf8proc_data.o
            else
              UTF8_DIR=$(dirname "$UTF8_SRC")
              gcc -c -O2 -I"$UTF8_PREFIX/include" "$UTF8_SRC" -o /tmp/utf8proc_lib.o
              gcc -c -O2 -I"$UTF8_PREFIX/include" "$UTF8_DIR/utf8proc_data.c" -o /tmp/utf8proc_data.o
              ar rcs /tmp/libutf8proc.a /tmp/utf8proc_lib.o /tmp/utf8proc_data.o
            fi
            STATIC_LIBS="$STATIC_LIBS /tmp/libutf8proc.a"
          fi

          echo "=== Static libs ==="
          echo "$STATIC_LIBS" | tr ' ' '\n' | grep .
          echo "==================="

          sh autogen.sh
          ./configure --enable-utf8proc \
            CPPFLAGS="-I${BREW}/include -I${OPENSSL}/include" \
            LDFLAGS="-L${BREW}/lib -L${OPENSSL}/lib"
          make -j$(sysctl -n hw.ncpu) \
            LIBS="$STATIC_LIBS -lncurses -lz -lresolv -framework Security -framework CoreFoundation -framework GSS"

      - name: Verify no Homebrew dylib deps
        run: |
          echo "=== otool -L tmtv ==="
          otool -L tmtv
          if otool -L tmtv | grep -q '/opt/homebrew\|/usr/local/Cellar'; then
            echo "ERROR: Binary still links to Homebrew shared libraries"
            exit 1
          fi
          echo "Binary is portable."

      - name: Package binary
        run: |
          mkdir -p dist
          cp tmtv dist/tmtv-macos-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: dist/

  release:
    name: Create Release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
