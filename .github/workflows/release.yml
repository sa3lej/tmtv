name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            pkg-config \
            libevent-dev \
            libncurses-dev \
            libssh-dev \
            libmsgpack-dev \
            libbsd-dev \
            bison \
            libutf8proc-dev

      - name: Build
        run: |
          sh autogen.sh
          ./configure
          make -j$(nproc)

      - name: Package binaries
        run: |
          mkdir -p dist
          cp tmtv dist/tmtv-linux-amd64
          cp tmtv-server dist/tmtv-server-linux-amd64

      - uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: dist/

  build-macos:
    name: Build macOS client
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install \
            autoconf \
            automake \
            pkg-config \
            libevent \
            libssh \
            msgpack-c \
            openssl@3 \
            bison \
            utf8proc

      - name: Build and repackage portable binary
        run: |
          export PATH="$(brew --prefix bison)/bin:$PATH"
          BREW="$(brew --prefix)"

          sh autogen.sh
          ./configure --enable-utf8proc
          make -j$(sysctl -n hw.ncpu)

          # Bundle all non-system dylibs alongside the binary
          mkdir -p dist/lib
          cp tmtv dist/
          # Find and copy all Homebrew dylibs the binary depends on
          otool -L tmtv | grep '/opt/homebrew\|/usr/local' | awk '{print $1}' | while read dylib; do
            cp "$dylib" dist/lib/
            # Rewrite the binary to look for dylibs in @executable_path/lib/
            install_name_tool -change "$dylib" "@executable_path/lib/$(basename $dylib)" dist/tmtv
          done
          # Also fix dylib cross-references (dylibs that depend on each other)
          for lib in dist/lib/*.dylib; do
            otool -L "$lib" | grep '/opt/homebrew\|/usr/local' | awk '{print $1}' | while read dep; do
              base=$(basename "$dep")
              if [ -f "dist/lib/$base" ]; then
                install_name_tool -change "$dep" "@loader_path/$base" "$lib"
              else
                cp "$dep" dist/lib/
                install_name_tool -change "$dep" "@loader_path/$(basename $dep)" "$lib"
              fi
            done
          done
          # Repeat for any new libs added in the previous pass
          for lib in dist/lib/*.dylib; do
            otool -L "$lib" | grep '/opt/homebrew\|/usr/local' | awk '{print $1}' | while read dep; do
              base=$(basename "$dep")
              if [ ! -f "dist/lib/$base" ]; then
                cp "$dep" dist/lib/
              fi
              install_name_tool -change "$dep" "@loader_path/$base" "$lib"
            done
          done

          # Ad-hoc codesign everything so macOS Gatekeeper allows loading
          for lib in dist/lib/*.dylib; do
            codesign --force --sign - "$lib"
          done
          codesign --force --sign - dist/tmtv

          echo "=== Final binary deps ==="
          otool -L dist/tmtv
          echo "=== Bundled libs ==="
          ls -la dist/lib/

      - name: Verify portable binary
        run: |
          if otool -L dist/tmtv | grep -q '/opt/homebrew\|/usr/local/Cellar'; then
            echo "ERROR: Binary still has absolute Homebrew paths"
            otool -L dist/tmtv
            exit 1
          fi
          echo "Binary is portable."

      - name: Package binary
        run: |
          cd dist && tar czf ../tmtv-macos-arm64.tar.gz tmtv lib/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: tmtv-macos-arm64.tar.gz

  release:
    name: Create Release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
