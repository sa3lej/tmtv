name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            pkg-config \
            libevent-dev \
            libncurses-dev \
            libssh-dev \
            libmsgpack-dev \
            libbsd-dev \
            bison \
            libutf8proc-dev

      - name: Build
        run: |
          sh autogen.sh
          ./configure
          make -j$(nproc)

      - name: Package binaries
        run: |
          mkdir -p dist
          cp tmtv dist/tmtv-linux-amd64
          cp tmtv-server dist/tmtv-server-linux-amd64

      - uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: dist/

  build-macos:
    name: Build macOS client
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install \
            autoconf \
            automake \
            pkg-config \
            libevent \
            libssh \
            msgpack-c \
            bison \
            utf8proc

      - name: Build with static deps
        run: |
          export PATH="$(brew --prefix bison)/bin:$PATH"
          BREW="$(brew --prefix)"

          # Collect .a paths for all non-system deps
          STATIC_LIBS=""
          for pkg in libevent libssh msgpack-c utf8proc; do
            prefix=$(brew --prefix "$pkg")
            for a in "$prefix"/lib/*.a; do
              [ -f "$a" ] && STATIC_LIBS="$STATIC_LIBS $a"
            done
          done

          sh autogen.sh
          # Configure finds headers via pkg-config, but we override
          # LIBS at make time to use static archives instead of -l flags
          ./configure --enable-utf8proc \
            CPPFLAGS="-I${BREW}/include" \
            LDFLAGS="-L${BREW}/lib"
          make -j$(sysctl -n hw.ncpu) \
            LIBS="$STATIC_LIBS -lncurses -lz -lresolv -framework Security -framework CoreFoundation"

      - name: Verify no Homebrew dylib deps
        run: |
          echo "=== otool -L tmtv ==="
          otool -L tmtv
          if otool -L tmtv | grep -q '/opt/homebrew\|/usr/local/Cellar'; then
            echo "ERROR: Binary still links to Homebrew shared libraries"
            exit 1
          fi
          echo "Binary is portable."

      - name: Package binary
        run: |
          mkdir -p dist
          cp tmtv dist/tmtv-macos-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: dist/

  release:
    name: Create Release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
