name: CI

on:
  push:
    branches: [master, main, tmtv-rebase, staging]
  pull_request:
    branches: [master, main]

jobs:
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            pkg-config \
            libevent-dev \
            libncurses-dev \
            libssh-dev \
            libmsgpack-dev \
            libbsd-dev \
            bison \
            libutf8proc-dev

      - name: Build
        run: |
          sh autogen.sh
          ./configure
          make -j$(nproc)

      - name: Verify client binary
        run: |
          ./tmtv -V

      - name: Verify server binary
        run: |
          ls -la tmtv-server
          ./tmtv-server 2>&1 | head -1 || true

      - name: Run tests
        run: |
          cd tests && make all

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: tmtv-linux-amd64
          path: |
            tmtv
            tmtv-server

  build-macos-arm64:
    name: Build (macOS arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install \
            autoconf \
            automake \
            pkg-config \
            libevent \
            libssh \
            msgpack-c \
            bison \
            utf8proc

      - name: Build
        run: |
          export PATH="$(brew --prefix bison)/bin:$PATH"
          sh autogen.sh
          ./configure --enable-utf8proc
          make -j$(sysctl -n hw.ncpu)

      - name: Verify binary
        run: |
          ./tmtv -V

      - name: Run tests
        run: |
          cd tests && make all

      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: tmtv-macos-arm64
          path: |
            tmtv

  build-macos-amd64:
    name: Build (macOS amd64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install x86_64 Homebrew and dependencies
        run: |
          # Install x86_64 Homebrew under Rosetta
          arch -x86_64 /bin/bash -c '
            NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          '
          arch -x86_64 /usr/local/bin/brew install \
            autoconf automake pkg-config libevent libssh msgpack-c bison utf8proc

      - name: Build
        run: |
          arch -x86_64 /bin/bash -c '
            export PATH="/usr/local/opt/bison/bin:/usr/local/bin:$PATH"
            export HOMEBREW_PREFIX=/usr/local
            sh autogen.sh
            ./configure --enable-utf8proc \
              CPPFLAGS="-I/usr/local/include" \
              LDFLAGS="-L/usr/local/lib"
            make -j$(sysctl -n hw.ncpu)
          '

      - name: Verify binary
        run: |
          file tmtv
          arch -x86_64 ./tmtv -V

      - name: Run tests
        run: |
          arch -x86_64 /bin/bash -c 'cd tests && make all'

      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: tmtv-macos-amd64
          path: |
            tmtv
