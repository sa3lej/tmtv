name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux amd64
    if: github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            pkg-config \
            libevent-dev \
            libncurses-dev \
            libssh-dev \
            libmsgpack-dev \
            libbsd-dev \
            bison \
            libutf8proc-dev

      - name: Build (dynamic, for tests)
        run: |
          sh autogen.sh
          ./configure --enable-sixel
          make -j$(nproc)

      - name: Verify binaries
        run: |
          ./tmtv -V
          ./tmtv-server -V

      - name: Run unit tests
        run: |
          cd tests && make all

      # Integration tests run on staging via staging-deploy.sh, not in CI.
      # The vpty virtual client conflicts with ephemeral CI environments.

      - name: Build static binaries (Docker/Alpine)
        run: |
          docker build --build-arg PLATFORM=amd64 --output type=local,dest=./out .

      - name: Verify static binaries
        run: |
          file out/build/tmtv
          out/build/tmtv -V
          file out/build/tmtv-server
          out/build/tmtv-server -V
          # Ensure no dynamic library dependencies (musl static)
          if ldd out/build/tmtv 2>&1 | grep -q 'not a dynamic'; then
            echo "OK: tmtv is statically linked"
          elif ldd out/build/tmtv 2>&1 | grep -qv 'linux-vdso\|ld-musl\|ld-linux'; then
            echo "WARNING: tmtv has unexpected dynamic dependencies"
            ldd out/build/tmtv
          fi

      - name: Package binaries
        run: |
          mkdir -p dist
          cp out/build/tmtv dist/tmtv-linux-amd64
          cp out/build/tmtv-server dist/tmtv-server-linux-amd64

      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: dist/

  build-macos-arm64:
    name: Build macOS arm64
    if: github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install \
            autoconf \
            automake \
            pkg-config \
            libevent \
            libssh \
            msgpack-c \
            openssl@3 \
            bison

      - name: Build utf8proc static library
        run: |
          git clone --depth 1 https://github.com/JuliaStrings/utf8proc.git /tmp/utf8proc
          cd /tmp/utf8proc
          make libutf8proc.a
          mkdir -p /tmp/utf8proc-static/{lib/pkgconfig,include}
          cp libutf8proc.a /tmp/utf8proc-static/lib/
          cp utf8proc.h /tmp/utf8proc-static/include/
          cat > /tmp/utf8proc-static/lib/pkgconfig/libutf8proc.pc << 'PCEOF'
          prefix=/tmp/utf8proc-static
          libdir=${prefix}/lib
          includedir=${prefix}/include

          Name: libutf8proc
          Description: UTF-8 processing library
          Version: 2.9.0
          Libs: -L${libdir} -lutf8proc
          Cflags: -I${includedir}
          PCEOF
          sed -i '' 's/^          //' /tmp/utf8proc-static/lib/pkgconfig/libutf8proc.pc

      - name: Build fully static binary
        run: |
          export PATH="$(brew --prefix bison)/bin:$PATH"
          BREW="$(brew --prefix)"
          OPENSSL="$(brew --prefix openssl@3)"

          STATIC_LIBS=""
          for pkg in libevent libssh msgpack-c openssl@3; do
            prefix=$(brew --prefix "$pkg")
            for a in "$prefix"/lib/*.a; do
              [ -f "$a" ] && STATIC_LIBS="$STATIC_LIBS $a"
            done
          done
          STATIC_LIBS="$STATIC_LIBS /tmp/utf8proc-static/lib/libutf8proc.a"

          export PKG_CONFIG_PATH="/tmp/utf8proc-static/lib/pkgconfig:${PKG_CONFIG_PATH}"

          sh autogen.sh
          ./configure --enable-utf8proc --enable-sixel \
            CPPFLAGS="-I${BREW}/include -I${OPENSSL}/include -I/tmp/utf8proc-static/include" \
            LDFLAGS="-L${BREW}/lib -L${OPENSSL}/lib -L/tmp/utf8proc-static/lib"
          make -j$(sysctl -n hw.ncpu) \
            LIBS="$STATIC_LIBS -lncurses -lz -lresolv -lgssapi_krb5 -framework Security -framework CoreFoundation -framework GSS"

      - name: Verify binary
        run: |
          ./tmtv -V
          otool -L tmtv
          if otool -L tmtv | grep -q '/opt/homebrew\|/usr/local/Cellar'; then
            echo "ERROR: Binary links to Homebrew shared libraries"
            exit 1
          fi

      - name: Run tests
        run: |
          cd tests && make all

      - name: Package binary
        run: |
          mkdir -p dist
          cp tmtv dist/tmtv-macos-arm64
          codesign --force --sign - dist/tmtv-macos-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/

  build-macos-amd64:
    name: Build macOS amd64
    if: startsWith(github.ref, 'refs/tags/v')
    # macos-15 is ARM64; use a native Intel runner and its existing Homebrew.
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install native Intel dependencies
        timeout-minutes: 10
        run: |
          test "$(uname -m)" = x86_64
          test "$(brew --prefix)" = /usr/local
          brew install \
            autoconf automake pkg-config libevent libssh msgpack-c openssl@3 bison

      - name: Build utf8proc static library
        run: |
          arch -x86_64 /bin/bash -c '
            git clone --depth 1 https://github.com/JuliaStrings/utf8proc.git /tmp/utf8proc
            cd /tmp/utf8proc
            make libutf8proc.a
            mkdir -p /tmp/utf8proc-static/{lib/pkgconfig,include}
            cp libutf8proc.a /tmp/utf8proc-static/lib/
            cp utf8proc.h /tmp/utf8proc-static/include/
            cat > /tmp/utf8proc-static/lib/pkgconfig/libutf8proc.pc << PCEOF
          prefix=/tmp/utf8proc-static
          libdir=\${prefix}/lib
          includedir=\${prefix}/include

          Name: libutf8proc
          Description: UTF-8 processing library
          Version: 2.9.0
          Libs: -L\${libdir} -lutf8proc
          Cflags: -I\${includedir}
          PCEOF
          '

      - name: Build fully static binary
        run: |
          arch -x86_64 /bin/bash -c '
            export PATH="/usr/local/opt/bison/bin:/usr/local/bin:$PATH"
            BREW=/usr/local
            OPENSSL="$(/usr/local/bin/brew --prefix openssl@3)"

            STATIC_LIBS=""
            for pkg in libevent libssh msgpack-c openssl@3; do
              prefix=$(/usr/local/bin/brew --prefix "$pkg")
              for a in "$prefix"/lib/*.a; do
                [ -f "$a" ] && STATIC_LIBS="$STATIC_LIBS $a"
              done
            done
            STATIC_LIBS="$STATIC_LIBS /tmp/utf8proc-static/lib/libutf8proc.a"

            export PKG_CONFIG_PATH="/tmp/utf8proc-static/lib/pkgconfig:${PKG_CONFIG_PATH}"

            sh autogen.sh
            ./configure --enable-utf8proc --enable-sixel \
              CPPFLAGS="-I${BREW}/include -I${OPENSSL}/include -I/tmp/utf8proc-static/include" \
              LDFLAGS="-L${BREW}/lib -L${OPENSSL}/lib -L/tmp/utf8proc-static/lib"
            make -j$(sysctl -n hw.ncpu) \
              LIBS="$STATIC_LIBS -lncurses -lz -lresolv -lgssapi_krb5 -framework Security -framework CoreFoundation -framework GSS"
          '

      - name: Verify binary
        run: |
          file tmtv
          test "$(lipo -archs tmtv)" = x86_64
          arch -x86_64 ./tmtv -V
          otool -L tmtv
          if otool -L tmtv | grep -q '/opt/homebrew\|/usr/local/'; then
            echo "ERROR: Binary links to Homebrew shared libraries"
            exit 1
          fi

      - name: Run tests
        run: |
          arch -x86_64 /bin/bash -c 'cd tests && make all'

      - name: Package binary
        run: |
          mkdir -p dist
          cp tmtv dist/tmtv-macos-amd64
          codesign --force --sign - dist/tmtv-macos-amd64

      - uses: actions/upload-artifact@v4
        with:
          name: macos-amd64
          path: dist/

  # Cross-arch builds only on tags (slow QEMU emulation)
  build-linux-cross:
    name: Build Linux ${{ matrix.arch }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64v8
            platform: linux/arm64
          - arch: arm32v7
            platform: linux/arm/v7
          - arch: arm32v6
            platform: linux/arm/v6
          - arch: i386
            platform: linux/386
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build static binary in Docker
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --build-arg PLATFORM=${{ matrix.arch }} \
            --output type=local,dest=./out \
            .

      - name: Package binaries
        run: |
          mkdir -p dist
          cp out/build/tmtv dist/tmtv-linux-${{ matrix.arch }}
          cp out/build/tmtv-server dist/tmtv-server-linux-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/

  deploy-web:
    name: Deploy web assets
    needs: [deploy-server]
    if: always() && !cancelled() && (needs.deploy-server.result == 'success' || needs.deploy-server.result == 'skipped') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          cd site
          npm ci
          npm run build

      - name: Set up SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ci
          chmod 600 ~/.ssh/id_ci
          ssh-keyscan -p ${{ secrets.DEPLOY_SSH_PORT }} ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload web assets
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          KEY="$HOME/.ssh/id_ci"
          SCP_OPTS="-i $KEY -o StrictHostKeyChecking=accept-new -P ${DEPLOY_PORT}"
          SSH_OPTS="-i $KEY -o StrictHostKeyChecking=accept-new -p ${DEPLOY_PORT}"

          scp ${SCP_OPTS} site/dist/index.html "${DEPLOY_TARGET}:staging/"
          scp ${SCP_OPTS} web/viewer.js "${DEPLOY_TARGET}:staging/"
          scp ${SCP_OPTS} site/dist/viewer/index.html "${DEPLOY_TARGET}:staging/viewer.html"
          scp ${SCP_OPTS} site/dist/install.sh "${DEPLOY_TARGET}:staging/"
          for f in site/dist/*.txt site/dist/*.png site/dist/*.gif site/dist/favicon.*; do
            [ -f "$f" ] && scp ${SCP_OPTS} "$f" "${DEPLOY_TARGET}:staging/" || true
          done

          ssh ${SSH_OPTS} "${DEPLOY_TARGET}" 'sudo /usr/local/bin/tmtv-deploy-web'

  deploy-server:
    name: Deploy server binary
    needs: [build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-amd64
          path: dist

      - name: Set up SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ci
          chmod 600 ~/.ssh/id_ci
          ssh-keyscan -p ${{ secrets.DEPLOY_SSH_PORT }} ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload and deploy binaries
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          KEY="$HOME/.ssh/id_ci"
          SCP_OPTS="-i $KEY -o StrictHostKeyChecking=accept-new -P ${DEPLOY_PORT}"
          SSH_OPTS="-i $KEY -o StrictHostKeyChecking=accept-new -p ${DEPLOY_PORT}"

          scp ${SCP_OPTS} dist/tmtv-server-linux-amd64 "${DEPLOY_TARGET}:staging/tmtv-server"
          scp ${SCP_OPTS} dist/tmtv-linux-amd64 "${DEPLOY_TARGET}:staging/tmtv"

          ssh ${SSH_OPTS} "${DEPLOY_TARGET}" 'sudo /usr/local/bin/tmtv-deploy-server'

  release:
    name: Create Release
    needs: [build-linux, build-linux-cross, build-macos-arm64, build-macos-amd64, deploy-server, deploy-web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify complete release and generate checksums
        run: bash .github/scripts/verify-release-assets.sh artifacts

      - name: Upload draft and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if test -f "$notes"; then
            note_args=(--notes-file "$notes")
          else
            note_args=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --draft --verify-tag --title "$GITHUB_REF_NAME" \
            "${note_args[@]}"
          # Failed or partial uploads must remain unpublished.
          diff <(find artifacts -maxdepth 1 -type f -printf '%f\n' | sort) \
            <(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort)
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

      - name: Update Homebrew tap
        continue-on-error: true
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA_ARM64=$(sha256sum artifacts/tmtv-macos-arm64 | awk '{print $1}')
          SHA_AMD64=$(sha256sum artifacts/tmtv-macos-amd64 | awk '{print $1}')

          mkdir -p Formula
          cat > Formula/tmtv.rb << FORMULA
          class Tmtv < Formula
            desc "Terminal sharing built on tmux — share your terminal over SSH and the web"
            homepage "https://tmtv.se"
            version "${VERSION}"
            license "ISC"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/sa3lej/tmtv/releases/download/v${VERSION}/tmtv-macos-arm64"
                sha256 "${SHA_ARM64}"
              elsif Hardware::CPU.intel?
                url "https://github.com/sa3lej/tmtv/releases/download/v${VERSION}/tmtv-macos-amd64"
                sha256 "${SHA_AMD64}"
              end
            end

            def install
              binary = Dir["tmtv-*"].first
              bin.install binary => "tmtv"
            end

            test do
              assert_match "tmtv", shell_output("#{bin}/tmtv -V")
            end
          end
          FORMULA
          sed -i 's/^          //' Formula/tmtv.rb

          git clone https://x-access-token:${TAP_TOKEN}@github.com/sa3lej/homebrew-tap.git tap
          cp Formula/tmtv.rb tap/Formula/tmtv.rb
          cd tap
          git config user.name "tmtv-bot"
          git config user.email "bot@tmtv.se"
          git add Formula/tmtv.rb
          git commit -m "Update tmtv to ${VERSION}"
          git push
