<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tmtv</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0c0c16;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(40, 20, 80, 0.3) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 50%, rgba(20, 40, 80, 0.2) 0%, transparent 60%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: "JetBrains Mono", "Fira Code", "SF Mono", "Menlo", monospace;
    overflow: hidden;
  }

  #status {
    color: #555;
    font-size: 11px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 6px 12px;
    position: fixed;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    background: rgba(12, 12, 22, 0.8);
    border-radius: 12px;
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.05);
    transition: opacity 0.8s ease, color 0.4s ease, border-color 0.4s ease;
    opacity: 1;
  }
  #status.connected {
    color: #3ddc84;
    border-color: rgba(61, 220, 132, 0.15);
  }
  #status.connected.fade { opacity: 0; pointer-events: none; }
  #status.error {
    color: #ff6b6b;
    border-color: rgba(255, 107, 107, 0.2);
  }

  #terminal-wrap {
    border-radius: 10px;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.06),
      0 8px 40px rgba(0,0,0,0.6),
      0 2px 12px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    max-width: calc(100vw - 32px);
    max-height: calc(100vh - 32px);
  }

  #titlebar {
    background: linear-gradient(180deg, #333346 0%, #2a2a3d 100%);
    height: 38px;
    min-height: 38px;
    display: flex;
    align-items: center;
    padding: 0 14px;
    position: relative;
    border-bottom: 1px solid rgba(0,0,0,0.4);
  }
  .dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    margin-right: 8px;
  }
  .dot.red { background: #ff5f57; box-shadow: 0 0 4px #ff5f57; }
  .dot.yellow { background: #febc2e; box-shadow: 0 0 4px #febc2e; }
  .dot.green { background: #28c840; box-shadow: 0 0 4px #28c840; }
  #titlebar-text {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    color: #888;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #titlebar-meta {
    color: #666;
    font-size: 10px;
    font-weight: 400;
  }
  #theme-toggle {
    position: absolute;
    right: 12px;
    background: none;
    border: none;
    color: #555;
    font-size: 16px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    transition: color 0.2s, background 0.2s;
    line-height: 1;
    opacity: 0.4;
  }
  #theme-toggle:hover { opacity: 1; color: #aaa; background: rgba(255,255,255,0.05); }

  /* --- TV Theme --- */
  body.theme-tv {
    background: #2a1f0e;
    background-image:
      radial-gradient(ellipse at 50% 80%, rgba(80, 60, 20, 0.4) 0%, transparent 60%);
  }

  .theme-tv #terminal-wrap {
    border-radius: 24px;
    border: 6px solid #3d3225;
    box-shadow:
      0 0 0 2px #1a150e,
      0 0 0 8px #4a3d2e,
      0 0 0 10px #2a2218,
      0 12px 60px rgba(0,0,0,0.8),
      inset 0 0 30px rgba(0,0,0,0.3);
    position: relative;
    margin-top: 60px;
    overflow: visible;
  }

  /* Antennas */
  .theme-tv #terminal-wrap::before,
  .theme-tv #terminal-wrap::after {
    content: '';
    position: absolute;
    bottom: 100%;
    width: 3px;
    background: linear-gradient(to top, #5a4d3a, #8a7d6a);
    border-radius: 2px 2px 0 0;
    z-index: 5;
  }
  .theme-tv #terminal-wrap::before {
    left: 30%;
    height: 50px;
    transform: rotate(-15deg);
    transform-origin: bottom center;
  }
  .theme-tv #terminal-wrap::after {
    right: 30%;
    height: 50px;
    transform: rotate(15deg);
    transform-origin: bottom center;
  }

  /* Antenna knobs */
  .theme-tv .antenna-knob-l,
  .theme-tv .antenna-knob-r {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #aaa, #555);
    z-index: 6;
    bottom: 100%;
  }
  .antenna-knob-l, .antenna-knob-r { display: none; }
  .theme-tv .antenna-knob-l { display: block; left: calc(30% - 12px); margin-bottom: 42px; }
  .theme-tv .antenna-knob-r { display: block; right: calc(30% - 12px); margin-bottom: 42px; }

  .theme-tv #titlebar {
    background: linear-gradient(180deg, #4a3d2e 0%, #3d3225 100%);
    border-bottom: 1px solid #2a2218;
    border-radius: 18px 18px 0 0;
  }
  .theme-tv .dot.red { background: #994433; box-shadow: none; }
  .theme-tv .dot.yellow { background: #997744; box-shadow: none; }
  .theme-tv .dot.green { background: #448844; box-shadow: none; }

  .theme-tv #terminal-container {
    border-radius: 8px;
    margin: 0 4px;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.5);
  }

  /* CRT screen curvature effect */
  .theme-tv #terminal-container::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 8px;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.3) 100%);
    pointer-events: none;
    z-index: 4;
  }

  /* Heavier scanlines for TV */
  .theme-tv #terminal-container::after {
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 1px,
      rgba(0,0,0,0.08) 1px,
      rgba(0,0,0,0.08) 2px
    );
    z-index: 3;
  }

  /* Phosphor glow */
  .theme-tv #terminal-container {
    background: #0a0f0a;
  }

  .theme-tv #tmux-status {
    border-radius: 0 0 18px 18px;
    margin: 0 4px 4px 4px;
  }

  .theme-tv #theme-toggle { color: #8a7d6a; }
  .theme-tv #theme-toggle:hover { color: #c0b090; }

  #terminal-container {
    background: #0d0d1a;
    position: relative;
    flex: 0 0 auto;
    overflow: hidden;
  }

  /* Pane border lines (drawn between panes) */
  .pane-border {
    position: absolute;
    background: #333346;
    z-index: 2;
  }

  #tmux-status {
    background: #005f00;
    color: #e0e0e0;
    font-family: "JetBrains Mono", "Fira Code", "SF Mono", "Menlo", monospace;
    font-size: 14px;
    line-height: 20px;
    padding: 1px 4px;
    display: flex;
    justify-content: space-between;
    min-height: 20px;
    white-space: nowrap;
    overflow: hidden;
  }
  #tmux-status-left { color: #ffffff; font-weight: bold; }
  #tmux-status-right { color: #d0d0d0; }

  /* Subtle scanline effect */
  #terminal-container::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.02) 2px,
      rgba(0,0,0,0.02) 4px
    );
    z-index: 3;
  }

  .xterm-viewport::-webkit-scrollbar { display: none; }
  .xterm-viewport { scrollbar-width: none; }
</style>
</head>
<body>
<div id="status">Connecting...</div>
<div id="terminal-wrap">
  <div class="antenna-knob-l"></div>
  <div class="antenna-knob-r"></div>
  <div id="titlebar">
    <div class="dot red"></div>
    <div class="dot yellow"></div>
    <div class="dot green"></div>
    <span id="titlebar-text">
      <span id="titlebar-label">tmtv</span>
      <span id="titlebar-meta"></span>
    </span>
    <button id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">&#9781;</button>
  </div>
  <div id="terminal-container"></div>
  <div id="tmux-status">
    <span id="tmux-status-left"></span>
    <span id="tmux-status-right"></span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@msgpack/msgpack@3.0.0-beta2/dist.es5+umd/msgpack.min.js"></script>
<script>
(function() {
  'use strict';

  /* --- Helpers --- */
  var _dec = new TextDecoder();
  function toStr(v) {
    if (v instanceof Uint8Array) return _dec.decode(v);
    if (v && v.buffer instanceof ArrayBuffer) return _dec.decode(new Uint8Array(v.buffer, v.byteOffset, v.byteLength));
    if (Array.isArray(v)) return String.fromCharCode.apply(null, v);
    return String(v);
  }

  /* --- Protocol constants --- */
  var CTL_HEADER         = 0;
  var CTL_DEAMON_OUT_MSG = 1;

  var OUT_HEADER      = 0;
  var OUT_SYNC_LAYOUT = 1;
  var OUT_PTY_DATA    = 2;
  var OUT_STATUS      = 5;
  var OUT_FIN         = 8;

  /* --- Shared terminal config --- */
  var FONT = '"JetBrains Mono", "Fira Code", "SF Mono", "Menlo", monospace';
  var THEME = {
    background: '#0d0d1a',
    foreground: '#e0e0e0',
    cursor: '#528bff',
    cursorAccent: '#0d0d1a',
    selectionBackground: 'rgba(82, 139, 255, 0.3)',
    black: '#1a1a2e',
    red: '#ff6b6b',
    green: '#3ddc84',
    yellow: '#ffd93d',
    blue: '#6c9efc',
    magenta: '#c084fc',
    cyan: '#67e8f9',
    white: '#e0e0e0',
    brightBlack: '#4a4a5e',
    brightRed: '#ff8a8a',
    brightGreen: '#6ee7a0',
    brightYellow: '#ffe066',
    brightBlue: '#93b8fc',
    brightMagenta: '#d4a5fc',
    brightCyan: '#8ef0fc',
    brightWhite: '#ffffff'
  };

  /* --- Multi-pane state --- */
  var serverCols = window.serverCols = 80;
  var serverRows = window.serverRows = 24;
  var contentRows = 24; /* actual pane content rows (serverRows - status line) */
  var panes = {};       // pane_id -> { term, el, sx, sy }
  var pendingData = {}; // pane_id -> [data chunks] buffered before pane created
  var cellW = 0, cellH = 0;
  var fontSize = 14;
  var cellRatioW = 0, cellRatioH = 0; // cell size per font point
  var container = document.getElementById('terminal-container');

  /* Measure cell-to-font ratio using a temporary terminal */
  function measureCellRatio() {
    if (cellRatioW > 0) return;
    var tmp = document.createElement('div');
    tmp.style.position = 'absolute';
    tmp.style.visibility = 'hidden';
    tmp.style.left = '-9999px';
    document.body.appendChild(tmp);
    var t = new Terminal({
      fontFamily: FONT, fontSize: 14, lineHeight: 1.15,
      cols: 10, rows: 2, allowProposedApi: true
    });
    t.open(tmp);
    try {
      var dims = t._core._renderService.dimensions;
      if (dims && dims.css && dims.css.cell) {
        cellRatioW = dims.css.cell.width / 14;
        cellRatioH = dims.css.cell.height / 14;
      }
    } catch (e) {}
    t.dispose();
    document.body.removeChild(tmp);
    if (!cellRatioW || !cellRatioH) { cellRatioW = 0.6; cellRatioH = 1.15; }
  }

  /* Compute optimal font size to fill the viewport */
  function computeFontSize() {
    measureCellRatio();
    var tvExtra = currentTheme === 'tv' ? 80 : 0; /* antenna + bezel space */
    var availW = window.innerWidth - 32 - (currentTheme === 'tv' ? 20 : 0);
    var availH = window.innerHeight - 32 - 38 - 20 - tvExtra; /* margins, titlebar, status */
    var maxFromW = availW / (serverCols * cellRatioW);
    var maxFromH = availH / (contentRows * cellRatioH);
    fontSize = Math.max(6, Math.min(Math.floor(Math.min(maxFromW, maxFromH)), 22));
    cellW = fontSize * cellRatioW;
    cellH = fontSize * cellRatioH;
  }

  function createPaneTerminal(sx, sy) {
    var t = new Terminal({
      fontFamily: FONT,
      fontSize: fontSize,
      lineHeight: 1.15,
      theme: THEME,
      cols: sx,
      rows: sy,
      scrollback: 0,
      cursorBlink: false,
      cursorStyle: 'block',
      disableStdin: true,
      allowProposedApi: true
    });
    return t;
  }

  /* Rebuild pane layout from SYNC_LAYOUT windows array.
   * windows: [[idx, name, [[pane_id, sx, sy, xoff, yoff], ...], active_pane_id], ...]
   * activeWinIdx: currently active window index */
  function updatePaneLayout(windows, activeWinIdx) {
    if (!Array.isArray(windows)) return;

    /* Find the active window's pane list */
    var paneList = null;
    var activePaneId = -1;
    for (var i = 0; i < windows.length; i++) {
      var win = windows[i];
      if (!Array.isArray(win)) continue;
      if (win[0] === activeWinIdx) {
        paneList = win[2];
        activePaneId = win[3];
        break;
      }
    }
    if (!paneList || !Array.isArray(paneList)) return;

    /* Compute content height from pane layout */
    var maxRow = 0;
    for (var i = 0; i < paneList.length; i++) {
      var p = paneList[i];
      if (Array.isArray(p) && p.length >= 5) {
        var bottom = p[4] + p[2]; /* yoff + sy */
        if (bottom > maxRow) maxRow = bottom;
      }
    }
    if (maxRow > 0) contentRows = maxRow;

    computeFontSize();

    var seen = {};

    /* Remove old border lines */
    var oldBorders = container.querySelectorAll('.pane-border');
    for (var i = 0; i < oldBorders.length; i++)
      oldBorders[i].remove();

    for (var i = 0; i < paneList.length; i++) {
      var p = paneList[i];
      if (!Array.isArray(p) || p.length < 5) continue;
      var id = p[0], sx = p[1], sy = p[2], xoff = p[3], yoff = p[4];
      seen[id] = true;

      var left = Math.round(xoff * cellW);
      var top = Math.round(yoff * cellH);
      var width = Math.round(sx * cellW);
      var height = Math.round(sy * cellH);

      if (panes[id]) {
        /* Update existing pane */
        var pane = panes[id];
        pane.el.style.left = left + 'px';
        pane.el.style.top = top + 'px';
        pane.el.style.width = width + 'px';
        pane.el.style.height = height + 'px';
        if (pane.term.options.fontSize !== fontSize) {
          pane.term.options.fontSize = fontSize;
        }
        if (pane.term.cols !== sx || pane.term.rows !== sy) {
          pane.term.resize(sx, sy);
        }
        pane.sx = sx;
        pane.sy = sy;
      } else {
        /* Create new pane */
        var el = document.createElement('div');
        el.style.position = 'absolute';
        el.style.left = left + 'px';
        el.style.top = top + 'px';
        el.style.width = width + 'px';
        el.style.height = height + 'px';
        el.style.overflow = 'hidden';
        container.appendChild(el);

        var t = createPaneTerminal(sx, sy);
        t.open(el);

        panes[id] = { term: t, el: el, sx: sx, sy: sy };

        /* Flush any buffered data for this pane */
        if (pendingData[id]) {
          for (var j = 0; j < pendingData[id].length; j++) {
            var d = pendingData[id][j];
            t.write(d instanceof Uint8Array ? d : String(d));
          }
          delete pendingData[id];
        }
      }

      /* Set cursor blink only on active pane */
      panes[id].term.options.cursorBlink = (id === activePaneId);

      /* Draw borders: if xoff > 0, draw a vertical line to the left */
      if (xoff > 0) {
        var border = document.createElement('div');
        border.className = 'pane-border';
        border.style.left = (left - 1) + 'px';
        border.style.top = top + 'px';
        border.style.width = '1px';
        border.style.height = height + 'px';
        container.appendChild(border);
      }
      /* If yoff > 0, draw a horizontal line above */
      if (yoff > 0) {
        var border = document.createElement('div');
        border.className = 'pane-border';
        border.style.left = left + 'px';
        border.style.top = (top - 1) + 'px';
        border.style.width = width + 'px';
        border.style.height = '1px';
        container.appendChild(border);
      }
    }

    /* Remove panes no longer in layout */
    for (var id in panes) {
      if (!seen[id]) {
        panes[id].term.dispose();
        panes[id].el.remove();
        delete panes[id];
      }
    }

    /* Update pane count metadata */
    paneCount = Object.keys(panes).length;
    updateMeta();
  }

  /* Resize the terminal-wrap to fit the server's terminal dimensions */
  function sizeToServer() {
    computeFontSize();
    var contentW = Math.ceil(serverCols * cellW);
    var contentH = Math.ceil(contentRows * cellH);
    var totalH = 38 + contentH + 20;

    var wrap = document.getElementById('terminal-wrap');
    var maxW = window.innerWidth - 32;
    var maxH = window.innerHeight - 32;

    wrap.style.width = Math.min(contentW, maxW) + 'px';
    wrap.style.height = Math.min(totalH, maxH) + 'px';
    container.style.height = contentH + 'px';
  }

  window.addEventListener('resize', function() { sizeToServer(); });

  var statusEl = document.getElementById('status');
  var fadeTimer = null;

  function setStatus(msg, cls) {
    statusEl.textContent = msg;
    statusEl.className = cls || '';
    if (fadeTimer) clearTimeout(fadeTimer);
    if (cls === 'connected') {
      fadeTimer = setTimeout(function() {
        statusEl.classList.add('fade');
      }, 2000);
    }
  }

  /* --- Build tmux-style status from sync_layout windows --- */
  function updateWindowList(windows, activeIdx) {
    if (!Array.isArray(windows)) return;

    var parts = [];
    for (var i = 0; i < windows.length; i++) {
      var win = windows[i];
      if (!Array.isArray(win) || win.length < 2) continue;
      var idx = win[0];
      var name = toStr(win[1]);
      var marker = (idx === activeIdx) ? '*' : '-';
      parts.push(idx + ':' + name + marker);
    }

    var leftEl = document.getElementById('tmux-status-left');
    if (leftEl && parts.length > 0) {
      leftEl.textContent = '[0] ' + parts.join(' ');
    }
  }

  /* --- SSE connection --- */

  var pathMatch = location.pathname.match(/^\/s\/([^\/]+)/);
  var sessionToken = pathMatch ? pathMatch[1] : null;

  /* --- Theme support --- */
  var params = new URLSearchParams(location.search);
  var currentTheme = params.get('theme') || localStorage.getItem('tmtv-theme') || '';
  function applyTheme(name) {
    document.body.className = name ? 'theme-' + name : '';
    currentTheme = name;
    localStorage.setItem('tmtv-theme', name);
  }
  applyTheme(currentTheme);
  document.getElementById('theme-toggle').addEventListener('click', function() {
    applyTheme(currentTheme === 'tv' ? '' : 'tv');
    sizeToServer();
  });

  var ssePort = params.get('port');
  var sseUrl = ssePort
    ? 'http://' + (location.hostname || 'localhost') + ':' + ssePort
    : '/ws';

  /* --- Session metadata --- */
  var sessionStart = null;
  var paneCount = 0;
  var durationTimer = null;

  if (sessionToken) {
    document.getElementById('titlebar-label').textContent = 'tmtv — ' + sessionToken.substring(0, 8);
  }

  function updateMeta() {
    var parts = [];
    if (paneCount > 0) parts.push(paneCount + (paneCount === 1 ? ' pane' : ' panes'));
    if (sessionStart) {
      var elapsed = Math.floor((Date.now() - sessionStart) / 1000);
      var m = Math.floor(elapsed / 60);
      var s = elapsed % 60;
      parts.push((m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s);
    }
    var metaEl = document.getElementById('titlebar-meta');
    if (metaEl) metaEl.textContent = parts.length ? parts.join(' · ') : '';
  }

  var reconnectAttempts = 0;
  var maxReconnect = 5;
  var sessionEnded = false;

  function connect() {
    setStatus('Connecting...');

    var es = new EventSource(sseUrl);

    es.onopen = function() {
      setStatus('Connected', 'connected');
      reconnectAttempts = 0;
      if (!sessionStart) {
        sessionStart = Date.now();
        durationTimer = setInterval(updateMeta, 1000);
      }
    };

    es.onmessage = function(evt) {
      var binary = atob(evt.data);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++)
        bytes[i] = binary.charCodeAt(i);
      try {
        var iter = MessagePack.decodeMulti(bytes);
        var result = iter.next();
        while (!result.done) {
          handleMessage(result.value);
          result = iter.next();
        }
      } catch (e) {}
    };

    es.onerror = function() {
      es.close();
      if (sessionEnded) {
        setStatus('Session ended', 'error');
        if (durationTimer) clearInterval(durationTimer);
        return;
      }
      if (reconnectAttempts < maxReconnect) {
        reconnectAttempts++;
        var delay = Math.min(1000 * Math.pow(2, reconnectAttempts - 1), 8000);
        setStatus('Reconnecting (' + reconnectAttempts + '/' + maxReconnect + ')...', 'error');
        setTimeout(connect, delay);
      } else {
        setStatus('Connection lost', 'error');
        if (durationTimer) clearInterval(durationTimer);
      }
    };
  }

  function handleMessage(msg) {
    if (!Array.isArray(msg) || msg.length < 2) return;

    var type = msg[0];

    switch (type) {
      case CTL_DEAMON_OUT_MSG:
        handleDaemonMsg(msg[1]);
        break;

      case CTL_HEADER:
        break;
    }
  }

  function handleDaemonMsg(inner) {
    if (!Array.isArray(inner) || inner.length < 1) return;

    var type = inner[0];

    switch (type) {
      case OUT_PTY_DATA:
        if (inner.length >= 3) {
          var paneId = inner[1];
          var ptyData = inner[2];
          var pane = panes[paneId];
          if (pane) {
            pane.term.write(ptyData instanceof Uint8Array ? ptyData : String(ptyData));
          } else {
            if (!pendingData[paneId]) pendingData[paneId] = [];
            pendingData[paneId].push(ptyData);
          }
        }
        break;

      case OUT_SYNC_LAYOUT:
        if (inner.length >= 3) {
          var sx = inner[1];
          var sy = inner[2];
          if (sx > 0 && sy > 0) {
            serverCols = sx;
            serverRows = sy;
            window.serverCols = sx;
            window.serverRows = sy;
          }
          if (inner.length >= 5) {
            updateWindowList(inner[3], inner[4]);
            updatePaneLayout(inner[3], inner[4]);
          }
          sizeToServer();
        }
        break;

      case OUT_HEADER:
        break;

      case OUT_STATUS:
        if (inner.length >= 3) {
          var leftEl = document.getElementById('tmux-status-left');
          var rightEl = document.getElementById('tmux-status-right');
          if (leftEl && inner[1]) leftEl.textContent = toStr(inner[1]);
          if (rightEl && inner[2]) rightEl.textContent = toStr(inner[2]);
        }
        break;

      case OUT_FIN:
        sessionEnded = true;
        setStatus('Session ended', 'error');
        if (durationTimer) clearInterval(durationTimer);
        break;
    }
  }

  /* --- Start --- */
  connect();

})();
</script>
</body>
</html>
